<!DOCTYPE html>

<html lang="en">
<head>

</head>

<body>

<div class="container-fluid h-100">
    <div class="row justify-content-center h-100">

```
    <div class="col-md-8 col-xl-7 chat">

        <div class="card">

            <div class="card-header msg_head">

                <div class="d-flex align-items-center">

                    <div class="img_cont">
                       <img src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png"
                       class="rounded-circle user_img">
                        <span class="online_icon"></span>
                    </div>

                    <div class="user_info ml-3">
                        <span>AI Medical Assistant</span>
                        <p>Powered by Gemini + Pinecone RAG</p>
                    </div>

                </div>

            </div>

            <div id="messageFormeight" class="card-body msg_card_body"></div>

            <div class="card-footer">

                <form id="messageArea" class="input-group">

                    <input
                            type="text"
                            id="text"
                            name="msg"
                            placeholder="Ask any medical question..."
                            autocomplete="off"
                            class="form-control type_msg"
                            required
                    />

                    <div class="input-group-append">
                        <button type="submit"
                                id="send"
                                class="input-group-text send_btn">
                            Send
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
```

</div>

<script>

$(document).ready(function () {

    $("#messageArea").on("submit", function (event) {

        const date = new Date();
        const str_time = date.getHours() + ":" + date.getMinutes();

        var rawText = $("#text").val();

        var userHtml =
            '<div class="d-flex justify-content-end mb-4">' +
            '<div class="msg_cotainer_send">' +
            rawText +
            '<span class="msg_time_send">' + str_time + '</span>' +
            '</div>' +
            '</div>';

        $("#text").val("");
        $("#messageFormeight").append(userHtml);

        $.ajax({
            data: {
                msg: rawText
            },
            type: "POST",
            url: "/get"
        }).done(function (data) {

            var botHtml =
                '<div class="d-flex justify-content-start mb-4">' +
                '<div class="msg_cotainer">' +
                data +
                '<span class="msg_time">' + str_time + '</span>' +
                '</div>' +
                '</div>';

            $("#messageFormeight").append($.parseHTML(botHtml));

            $("#messageFormeight").scrollTop(
                $("#messageFormeight")[0].scrollHeight
            );
        });

        event.preventDefault();
    });

});

</script>

</body>
</html>
